name: Library assistant checks
on:
  pull_request:
    paths: ['coursework/library-management-system/**', 'demo/library/**', '.github/workflows/library-ci.yml']
  push:
    branches: [main]
    paths: ['coursework/library-management-system/**', 'demo/library/**', '.github/workflows/library-ci.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Native boundaries, facts, consent and existing workbench authorization
        run: mvn --batch-mode package
        working-directory: coursework/library-management-system/backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coursework/library-management-system/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: coursework/library-management-system/frontend
      - run: npm test && npm run build
        working-directory: coursework/library-management-system/frontend
      - name: Public demo projection
        run: node --test demo/tests/*.test.mjs
