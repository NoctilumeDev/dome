# 服务配置
server:
  port: 22090
  servlet:
    context-path: /api/book-manage-sys-api/v1.0

# API地址前缀，用于拦截器白名单
my-server:
  api-context-path: /api/book-manage-sys-api/v1.0

# MySQL与文件上传限制配置
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/library_management?characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

# 让 Mybatis 在 Mapper目录下找到 XML 映射文件
mybatis:
  mapper-locations: classpath:mapper/*.xml

# JWT 配置
jwt:
  secret: ${JWT_SECRET:d8c986df-8512-42b5-906f-eeea9b3acf86}
  expiration: ${JWT_EXPIRATION:604800000}

# 借阅配置
borrow:
  max-count: 5

# CORS配置
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:8080,http://localhost:5173,http://localhost:22091}

# DeepSeek 模型配置
deepseek:
  api-url: ${DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-chat}

# 文件上传路径
file:
  upload-dir: ${FILE_UPLOAD_DIR:./upload/pic}
