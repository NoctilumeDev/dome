<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>青野 · 浏览器体验</title>
    <link rel="stylesheet" href="../shared/shell.css" />
    <link rel="stylesheet" href="browser.css" />
    <script src="../shared/shell.js"></script>
    <script defer src="vue.min.js"></script>
    <script defer src="templates.js"></script>
    <script defer src="sources.js"></script>
    <script type="module" src="runtime.mjs"></script>
  </head>
  <body>
    <main class="qy-layout">
      <aside class="qy-intro">
        <span>QINGYE / 青野</span>
        <h1>去见面，<br />去参与。</h1>
        <p>打开一场活动，认识一起出发的人。<br />这里保留小程序页面的校园风格。</p>
        <p class="qy-hint">
          可以从顶部切换同学、社团负责人和管理员。问答仅匹配本地样例；微信登录、原生键盘和真实后端不在浏览器演示范围。
        </p>
        <a href="https://github.com/NoctilumeDev/dome/tree/main/qingye">查看小程序源码 ↗</a>
      </aside>
      <section class="qy-phone qy-surface" aria-label="青野浏览器体验">
        <header class="qy-nav">
          <button id="qy-back" aria-label="返回上一页">‹</button><strong id="qy-title">青野</strong
          ><span>✦</span>
        </header>
        <div id="qingye-app"></div>
        <nav id="qy-tabs" aria-label="青野主导航">
          <button data-route="home">⌂<span>发现</span></button
          ><button data-route="clubs">♧<span>社团</span></button
          ><button data-route="me">♙<span>我的</span></button>
        </nav>
      </section>
    </main>
    <div id="qy-toast" role="status" aria-live="polite" hidden></div>
    <dialog id="qy-dialog">
      <form method="dialog">
        <h2>青野</h2>
        <p id="qy-dialog-text"></p>
        <input id="qy-dialog-input" aria-label="审核意见" />
        <div><button value="cancel">取消</button><button value="confirm">确定</button></div>
      </form>
    </dialog>
  </body>
</html>
