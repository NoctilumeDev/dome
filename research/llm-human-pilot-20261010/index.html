<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>范围确认真人试跑</title>
<style>body{margin:0;background:#f5f6fa;color:#172033;font:17px/1.7 system-ui,'Microsoft YaHei',sans-serif}main{max-width:790px;margin:44px auto;padding:0 24px}.card{background:white;border:1px solid #dce2ec;border-radius:16px;padding:26px;margin:22px 0}h1{font-size:29px}h2{font-size:21px;margin:0 0 12px}.muted{color:#596577;font-size:15px}.scope{border-left:4px solid #486ad8;padding:12px 18px;background:#f1f4ff}button{font:inherit;padding:10px 20px;border-radius:10px;border:1px solid #bdc9df;background:white;cursor:pointer;margin:8px 10px 0 0}button.primary{color:white;background:#355ecb;border-color:#355ecb}button:disabled{opacity:.5;cursor:wait}textarea{box-sizing:border-box;width:100%;padding:10px;font:inherit;border:1px solid #bfcade;border-radius:8px}#error{color:#a62f22}</style>
<main><h1>范围确认真人试跑</h1><div id="app"></div><p id="error"></p><p class="muted">本地研究原型 · P01 · 无模型调用、数据库读取或真实业务执行</p></main>
<script>
let state,shownAt=0,busy=false;
function text(tag,value,cls){let e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e}
async function call(path,body){let r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify({...body,token:state.token}):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}
function button(label,choice,primary=false){let b=text('button',label,primary?'primary':'');b.onclick=()=>submit(choice);return b}
function render(){let a=document.getElementById('app');a.replaceChildren();if(!state.started){let c=text('section','','card');c.append(text('h2','开始前'),text('p','共12个任务。每次先看原请求，再核对系统展示的查询范围：这是你要的就继续，不是就纠正，拿不准可以选不确定。'),text('p','只记录按钮选择、可选说明和用时；不读取真实个人记录。你已经了解研究背景，因此这是单人试跑，不是独立盲评。可以随时关闭页面，已答记录会保留。','muted'));let b=button('我了解，开始试跑','START',true);c.append(b);a.append(c);return}if(!state.task){a.append(text('section','已完成12个任务，回答已保存。你可以告诉我“pilot 做完了”。','card'));return}a.append(text('p',`任务 ${state.completed+1} / ${state.total} · ${state.task.system}`,'muted'));let q=text('section','','card');q.append(text('h2','假设这是你的请求'),text('p',state.task.question));let c=text('section','','card');c.append(text('h2','系统请你确认'),text('p','我理解你要查询：'+state.task.interpretation),text('p',state.task.scope,'scope'),text('p','确认后按这个范围查询；若不是你的意思，请纠正。','muted'));let note=document.createElement('textarea');note.id='note';note.rows=2;note.placeholder='可选：哪里不符合你的意思？';c.append(note,button('继续查询','ACCEPT',true),button('不是这个意思','CORRECT'),button('不确定','UNSURE'));a.append(q,c);shownAt=performance.now()}
async function submit(choice){if(busy)return;busy=true;document.getElementById('error').textContent='';document.querySelectorAll('button').forEach(x=>x.disabled=true);try{state=await call(choice==='START'?'/start':'/answer',choice==='START'?{}:{taskId:state.task.id,choice,note:document.getElementById('note').value,elapsedMs:performance.now()-shownAt});render()}catch(e){document.getElementById('error').textContent=e.message;document.querySelectorAll('button').forEach(x=>x.disabled=false)}finally{busy=false}}
call('/state').then(s=>{state=s;render()}).catch(e=>document.getElementById('error').textContent=e.message);
</script></html>
