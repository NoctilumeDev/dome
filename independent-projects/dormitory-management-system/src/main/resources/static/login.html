<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宿舍管理系统 - 登录</title>
  <link rel="stylesheet" href="styles.css?v=20260914-4">
</head>
<body>
  <main class="login-page">
    <div class="card">
      <h1>宿舍管理系统</h1>
      <section id="loginFailure" class="login-failure" role="alert" hidden>
        <div id="failureCode" class="failure-code"></div>
        <h2 id="failureTitle" tabindex="-1"></h2>
        <p id="failureDescription"></p>
        <div class="failure-actions"><button id="retryLogin" type="button">重新尝试</button><button id="backToLogin" class="secondary" type="button">返回登录</button></div>
      </section>
      <div id="loginForm">
      <p>演示账号：admin / manager / student</p>
      <p>密码统一为 123456</p>

      <div class="login-field">
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" placeholder="请输入用户名" aria-describedby="msg">
      </div>
      <div class="login-field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" aria-describedby="msg">
      </div>

      <button id="loginBtn" type="button">登录</button>
      <div id="msg" role="status" aria-live="polite"></div>

      <details class="register-box">
        <summary>注册</summary>
        <label for="registerUsername">用户名</label>
        <input id="registerUsername" autocomplete="username" placeholder="至少 3 个字符">
        <label for="registerFullName">姓名</label>
        <input id="registerFullName" autocomplete="name" placeholder="请输入姓名">
        <label for="registerPassword">密码</label>
        <input id="registerPassword" type="password" autocomplete="new-password" placeholder="6～32 个字符">
        <label for="registerPasswordAgain">确认密码</label>
        <input id="registerPasswordAgain" type="password" autocomplete="new-password" placeholder="再次输入密码">
        <button id="registerBtn" type="button">注册学生账号</button>
        <div id="registerMsg" role="status" aria-live="polite"></div>
      </details>
      </div>
    </div>
  </main>
  <script>
    const msg = document.getElementById('msg');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');
    const registerMsg = document.getElementById('registerMsg');
    const failurePanel = document.getElementById('loginFailure');
    const loginForm = document.getElementById('loginForm');
    function showFailure(status, kind = '') {
      const copy = {
        403: ['登录请求被拒绝', '当前账号或登录入口不允许访问。请返回检查账号，或联系管理员。'],
        404: ['找不到登录服务', '登录接口不存在或地址已变更。请联系管理员检查服务地址。'],
        429: ['登录请求过于频繁', '请稍等片刻再尝试，避免连续提交。'],
        500: ['登录服务出现故障', '服务暂时无法完成登录，请稍后重试。'],
        502: ['登录服务暂不可达', '服务连接暂时异常，请稍后重试。'],
        503: ['登录服务暂不可用', '服务可能正在维护，请稍后重试。'],
        504: ['登录服务响应超时', '服务没有及时响应，请稍后重试。']
      };
      const fallback = kind === 'INVALID_RESPONSE' ? ['登录响应不完整', '服务没有返回有效的登录信息。请重试，或联系管理员检查服务。'] : kind === 'TIMEOUT' ? ['登录服务响应超时', '请检查网络连接，稍后重试。'] : status ? ['暂时无法登录', '登录请求没有完成，请返回登录或稍后重试。'] : ['暂时连接不上登录服务', '请检查网络连接；本地运行时请确认后端已启动。'];
      document.getElementById('failureCode').textContent = status || (kind === 'INVALID_RESPONSE' ? '响应异常' : kind === 'TIMEOUT' ? '连接超时' : '连接失败');
      document.getElementById('failureTitle').textContent = (copy[status] || fallback)[0];
      document.getElementById('failureDescription').textContent = (copy[status] || fallback)[1];
      failurePanel.hidden = false; loginForm.hidden = true;
      document.getElementById('failureTitle').focus();
    }

    function setMsg(text, kind = '') {
      msg.textContent = text;
      msg.dataset.kind = kind;
    }

    function clearCredentialError() {
      [usernameInput, passwordInput].forEach(input => {
        input.classList.remove('is-invalid');
        input.removeAttribute('aria-invalid');
      });
    }

    function markCredentialError() {
      [usernameInput, passwordInput].forEach(input => {
        input.classList.add('is-invalid');
        input.setAttribute('aria-invalid', 'true');
      });
    }

    function setBusy(isBusy) {
      loginBtn.disabled = isBusy;
      loginBtn.textContent = isBusy ? '登录中...' : '登录';
      document.getElementById('retryLogin').disabled = isBusy;
      document.getElementById('backToLogin').disabled = isBusy;
    }

    const doLogin = async () => {
      if (loginBtn.disabled) return;
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      clearCredentialError();

      if (!username || !password) {
        if (!username) {
          usernameInput.classList.add('is-invalid');
          usernameInput.setAttribute('aria-invalid', 'true');
        }
        if (!password) {
          passwordInput.classList.add('is-invalid');
          passwordInput.setAttribute('aria-invalid', 'true');
        }
        setMsg('请检查标红的用户名和密码字段', 'error');
        (!username ? usernameInput : passwordInput).focus();
        return;
      }

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);
      try {
        setBusy(true);
        setMsg('');
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          credentials: 'same-origin',
          signal: controller.signal,
          body: JSON.stringify({ username, password })
        });
        const dataText = await res.text();
        let data = {};
        try {
          data = dataText ? JSON.parse(dataText) : {};
        } catch (err) {
          data = {};
        }
        if (res.ok && data && data.id && data.username) {
          failurePanel.hidden = true; loginForm.hidden = false;
          sessionStorage.setItem('dorm_me', JSON.stringify({
            id: data.id,
            username: data.username,
            fullName: data.fullName,
            role: data.role
          }));
          const target = `${window.location.origin}/index.html`;
          setMsg('登录成功，正在跳转...', 'success');
          window.location.href = `${target}?fromLogin=1`;
          setTimeout(() => {
            msg.innerHTML = `如果没有自动跳转，<a href="${target}">点此进入主页</a>`;
          }, 800);
        } else if (res.status === 401) {
          failurePanel.hidden = true; loginForm.hidden = false;
          markCredentialError();
          setMsg('用户名或密码错误，请检查这两项后重试', 'error');
          usernameInput.focus();
        } else if ([400, 422].includes(res.status)) {
          failurePanel.hidden = true; loginForm.hidden = false;
          const reason = data.message || `登录失败（${res.status}）`;
          setMsg(reason, 'error');
        } else showFailure(res.ok ? 0 : res.status, res.ok ? 'INVALID_RESPONSE' : '');
      } catch (err) {
        showFailure(0, err.name === 'AbortError' ? 'TIMEOUT' : '');
      } finally {
        clearTimeout(timeout);
        setBusy(false);
      }
    };

    const doRegister = async () => {
      const username = document.getElementById('registerUsername').value.trim();
      const fullName = document.getElementById('registerFullName').value.trim();
      const password = document.getElementById('registerPassword').value;
      const passwordAgain = document.getElementById('registerPasswordAgain').value;

      if (!username || !fullName || !password || !passwordAgain) {
        registerMsg.textContent = '请把注册信息填写完整';
        return;
      }
      if (password !== passwordAgain) {
        registerMsg.textContent = '两次输入的密码不一致';
        return;
      }

      try {
        registerBtn.disabled = true;
        registerBtn.textContent = '注册中...';
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username, fullName, password })
        });
        const data = await res.json();
        registerMsg.textContent = data.message || (res.ok ? '注册成功' : '注册失败');
        if (res.ok) {
          usernameInput.value = username;
          passwordInput.value = '';
          clearCredentialError();
          document.querySelector('.register-box').open = false;
          setMsg('注册成功，用户名已填好，请输入密码登录', 'success');
          passwordInput.focus();
        }
      } catch (err) {
        registerMsg.textContent = '网络异常，请检查后端是否启动';
      } finally {
        registerBtn.disabled = false;
        registerBtn.textContent = '注册学生账号';
      }
    };

    loginBtn.addEventListener('click', doLogin);
    document.getElementById('retryLogin').addEventListener('click', doLogin);
    document.getElementById('backToLogin').addEventListener('click', () => {
      failurePanel.hidden = true; loginForm.hidden = false; setMsg(''); usernameInput.focus();
    });
    registerBtn.addEventListener('click', doRegister);
    [usernameInput, passwordInput].forEach(input => {
      input.addEventListener('input', () => {
        clearCredentialError();
        if (msg.dataset.kind === 'error') {
          setMsg('');
        }
      });
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          doLogin();
        }
      });
    });
  </script>
</body>
</html>
