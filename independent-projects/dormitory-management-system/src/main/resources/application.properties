spring.application.name=dormitory-management-system
server.port=8660

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/dormitory_management?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
